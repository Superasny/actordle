<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actordle</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* [Tutaj wklej cały swój CSS z poprzedniej wiadomości - nic nie zmieniaj] */
        :root { --bg: #0d0d0f; --surface: #161618; --surface2: #1e1e21; --border: rgba(255,255,255,0.07); --border-bright: rgba(255,255,255,0.14); --gold: #e8c84a; --gold-dim: rgba(232,200,74,0.15); --green: #22c55e; --green-bg: rgba(34,197,94,0.12); --green-border: rgba(34,197,94,0.4); --red: #ef4444; --red-bg: rgba(239,68,68,0.12); --red-border: rgba(239,68,68,0.4); --yellow: #f59e0b; --yellow-bg: rgba(245,158,11,0.15); --yellow-border: rgba(245,158,11,0.4); --text: #f0eee8; --text-muted: #6b6966; --text-dim: #9c9893; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 0 0 60px; background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(232,200,74,0.06), transparent); }
        .site-header { border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: center; height: 64px; background: rgba(13,13,15,0.8); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; }
        .logo { display: flex; align-items: baseline; gap: 6px; }
        .logo-icon { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.06em; color: var(--text); }
        .logo-badge { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); background: var(--gold-dim); border: 1px solid rgba(232,200,74,0.25); padding: 2px 8px; border-radius: 20px; }
        .archive-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 20px 0 10px; }
        .nav-btn { background: var(--surface); border: 1px solid var(--border-bright); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .nav-btn:disabled { opacity: 0.2; cursor: not-allowed; }
        .day-label { font-family: 'Bebas Neue'; font-size: 24px; color: var(--gold); }
        .page-center { max-width: 950px; margin: 0 auto; padding: 10px 20px 0; }
        .tagline { text-align: center; font-size: 13px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 20px; }
        #message { text-align: center; font-size: 15px; font-weight: 500; color: var(--gold); margin-bottom: 20px; min-height: 24px; }
        .search-container { position: relative; margin-bottom: 15px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .search-container input { width: 100%; padding: 14px 18px 14px 46px; font-size: 15px; background: var(--surface); border: 1px solid var(--border-bright); border-radius: 12px; color: var(--text); outline: none; }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
        #giveUpBtn { display: none; background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid var(--red-border); padding: 10px 20px; border-radius: 10px; cursor: pointer; margin: 0 auto 20px; font-weight: 600; }
        .results-btn { display: none; background: var(--surface2); color: var(--gold); border: 1px solid var(--gold); padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; margin: 0 auto 24px; }
        .autocomplete-items { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface2); border: 1px solid var(--border-bright); border-radius: 12px; z-index: 200; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
        .autocomplete-item { padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
        .autocomplete-item:hover { background: rgba(255,255,255,0.04); }
        .autocomplete-img { width: 32px; height: 44px; object-fit: cover; border-radius: 6px; }
        .hints-container { display: none; flex-direction: column; gap: 10px; margin-bottom: 24px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .hint-box { background: var(--surface); border: 1px solid var(--border-bright); border-left: 3px solid var(--gold); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 14px; animation: slideDown 0.3s ease; }
        .hint-poster { width: 44px; height: 64px; object-fit: cover; border-radius: 5px; flex-shrink: 0; cursor: pointer; }
        .hint-poster.blurred { filter: blur(10px) grayscale(0.3); }
        .hint-label { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--gold); }
        .hint-title { font-size: 14px; font-weight: 600; color: var(--text); }
        .board { margin-top: 4px; overflow-x: auto; padding-bottom: 10px; }
        .grid-cols { display: grid; grid-template-columns: 100px 48px 80px 1fr 60px 60px 80px 85px; width: 100%; min-width: 680px; gap: 6px; }
        .header-row { display: none; margin-bottom: 8px; }
        .header-row.grid-cols { display: grid; }
        .header-box { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .guess-row { margin-bottom: 6px; }
        .box { border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; text-align: center; min-height: 76px; border: 1px solid transparent; animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .box.green { background: var(--green-bg); border-color: var(--green-border); color: #86efac; }
        .box.red { background: var(--red-bg); border-color: var(--red-border); color: #fca5a5; }
        .box.yellow { background: var(--yellow-bg); border-color: var(--yellow-border); color: #fcd34d; }
        .photo-box { background: var(--surface); border-color: var(--border-bright) !important; }
        .actor-img { width: 48px; height: 64px; object-fit: cover; border-radius: 6px; margin-bottom: 5px; }
        .modal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); justify-content: center; align-items: center; }
        .modal-card { background: var(--surface); border: 1px solid var(--border-bright); padding: 30px; border-radius: 20px; text-align: center; width: min(90vw, 400px); }
        .end-title { font-family: 'Bebas Neue'; font-size: 36px; margin-bottom: 20px; }
        .end-actor-card { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px; }
        .end-actor-img { width: 90px; height: 130px; object-fit: cover; border-radius: 12px; border: 2px solid var(--green); }
        .share-btn { background: var(--green); color: black; border: none; padding: 12px 24px; font-weight: 600; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin: 0 auto 20px; }
        .close-modal { position: absolute; top: 18px; right: 22px; color: white; font-size: 32px; cursor: pointer; }
        .modal-content { max-width: min(90vw, 360px); border-radius: 12px; transition: filter 0.3s; }
        .modal-content.blurred { filter: blur(30px); }
        @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideDown { 0% { transform: translateY(-20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo"><span class="logo-icon">🎬 Actordle</span><span class="logo-badge">Dzienny</span></div>
    </header>

    <div class="archive-nav">
        <button id="prevDay" class="nav-btn">◀</button>
        <div id="dayLabel" class="day-label">Dzień #...</div>
        <button id="nextDay" class="nav-btn">▶</button>
    </div>

    <div class="page-center">
        <div id="message">Ładowanie… ⏳</div>
        <div id="hintsContainer" class="hints-container"></div>
        <div class="search-container" id="searchArea">
            <span class="search-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
            <input type="text" id="actorInput" placeholder="Wyszukaj aktora…" autocomplete="off" disabled>
            <div id="autocomplete-list" class="autocomplete-items"></div>
        </div>
        <button id="giveUpBtn" onclick="giveUp()" style="display:none; background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); padding: 10px 20px; border-radius: 10px; cursor: pointer; margin: 0 auto 20px; font-weight: 600; width: fit-content;">🏳 PODDAJ SIĘ</button>
        <button id="showStatsBtn" class="results-btn" onclick="openEndModal()">📊 POKAŻ MOJE STATYSTYKI</button>
        <div class="board" id="board">
            <div class="header-row grid-cols" id="headerRow" style="display:none;">
                <div class="header-box">Aktor</div><div class="header-box">Płeć</div><div class="header-box">Gatunek</div><div class="header-box">Wspólny Film</div><div class="header-box">Rok ur.</div><div class="header-box">Debiut</div><div class="header-box">L. filmów</div><div class="header-box">Kraj ur.</div>
            </div>
            <div id="guessesContainer"></div>
        </div>
    </div>
  <!-- testowanie-->
    <!-- Modale -->
    <div id="imageModal" class="modal" onclick="closeModal()"><span class="close-modal">&times;</span><img class="modal-content" id="modalImg"></div>
    <div id="endModal" class="modal"><div class="modal-card"><span class="close-modal" onclick="closeEndModal()">&times;</span><div id="endTitle" class="end-title">...</div><div class="end-actor-card"><img id="endActorImg" class="end-actor-img" src=""><div style="text-align: left;"><div id="endActorName" style="font-size:22px; font-weight:600; color:white;"></div><div id="endActorStats" style="font-size:14px; color:var(--text-dim);"></div></div></div><button class="share-btn" onclick="copyShareResult()">UDOSTĘPNIJ WYNIK</button><div id="countdownTimer" style="font-family:'Bebas Neue'; font-size:28px; color:var(--gold); border-top:1px solid var(--border); padding-top:15px;">00:00:00</div></div></div>

    <script>
        const BASE_IMG_URL = "https://image.tmdb.org/t/p/w200";
        const genreMap = { 28:"Akcja",12:"Przygoda",16:"Animacja",35:"Komedia",80:"Kryminał",99:"Dokument",18:"Dramat",10751:"Familijny",14:"Fantasy",36:"Historia",27:"Horror",10402:"Muzyczny",9648:"Tajemnica",10749:"Romans",878:"Sci-Fi",10770:"Film TV",53:"Thriller",10752:"Wojenny",37:"Western" };
        let targetActor, gameState, currentDayIdx;

        async function initGame() {
            const urlParams = new URLSearchParams(window.location.search);
            const dayParam = urlParams.get('day');
            const apiRes = await fetch(dayParam ? `/api/daily-actor?day=${dayParam}` : '/api/daily-actor');
            const apiData = await apiRes.json();
            currentDayIdx = apiData.currentDay;
            document.getElementById('dayLabel').innerText = `Dzień #${currentDayIdx}`;
            document.getElementById('prevDay').disabled = currentDayIdx <= 0;
            document.getElementById('nextDay').disabled = currentDayIdx >= apiData.realToday;
            targetActor = await fetchCleanActorData(apiData.actorId);
            gameState = JSON.parse(localStorage.getItem(`actordle_v3_day_${currentDayIdx}`)) || { guesses:[], wrongCount:0, status: "playing" };
            document.getElementById('actorInput').disabled = gameState.status !== "playing";
            document.getElementById('message').innerText = gameState.status === "playing" ? "Wpisz nazwisko gwiazdy!" : "";
            if (gameState.guesses.length > 0) {
                document.getElementById('headerRow').style.display = 'grid';
                gameState.guesses.forEach(g => displayGuess(g, true));
                checkHints();
            }
            if (gameState.status !== "playing") endGame(false);
        }

        async function fetchCleanActorData(id) {
            const res = await fetch(`/api/actor-details?id=${id}`);
            const data = await res.json();
            let debut=0, charN="?", topM=null;
            if (data.movie_credits?.cast) {
                const sorted = [...data.movie_credits.cast].sort((a,b)=>b.popularity-a.popularity);
                for (let m of sorted) if (m.character && m.character.length>2 && !m.character.toLowerCase().includes("self")) { charN=m.character; break; }
                const dated = data.movie_credits.cast.filter(m=>m.release_date?.length>3).sort((a,b)=>new Date(a.release_date)-new Date(b.release_date));
                if (dated.length>0) debut = parseInt(dated[0].release_date.substring(0,4));
                const hi = data.movie_credits.cast.filter(m=>m.vote_count>=300).sort((a,b)=>b.vote_average-a.vote_average);
                if (hi.length>0) topM={title:hi[0].title, poster:hi[0].poster_path?BASE_IMG_URL+hi[0].poster_path:'https://via.placeholder.com/40x60/1e1e21/666?text=?', rating:hi[0].vote_average.toFixed(1)};
                var projects = sorted.slice(0,30).map(m=>({id:m.id,title:m.title,poster:m.poster_path?BASE_IMG_URL+m.poster_path:'https://via.placeholder.com/40x60/1e1e21/666?text=?'}));
                var gCounts={}; data.movie_credits.cast.forEach(m=>m.genre_ids?.forEach(id=>gCounts[id]=(gCounts[id]||0)+1));
                var topG = Object.keys(gCounts).sort((a,b)=>gCounts[b]-gCounts[a])[0];
            }
            return { id:data.id, name:data.name, gender:data.gender===1?'K':'M', year:data.birthday?parseInt(data.birthday.substring(0,4)):0, debut, moviesPlayed:data.movie_credits?.cast.length||0, topMovie:topM, iconicCharacter:charN, nat:data.place_of_birth?.split(',').pop().trim() || "Nieznany", projects, genre:genreMap[topG]||"Nieznany", image:data.profile_path?BASE_IMG_URL+data.profile_path:'https://via.placeholder.com/200x300/1e1e21/666?text=?' };
        }

        document.getElementById('actorInput').addEventListener('input', function() {
            let val = this.value; document.getElementById('autocomplete-list').innerHTML=''; if (!val) return;
            clearTimeout(this.timeout);
            this.timeout = setTimeout(async()=>{
                const res = await fetch(`/api/search-actor?query=${encodeURIComponent(val)}`);
                const data = await res.json();
                data.results.filter(p=>p.known_for_department==="Acting").slice(0,5).forEach(person=>{
                    const item = document.createElement('div'); item.className='autocomplete-item';
                    item.innerHTML=`<img src="${person.profile_path?BASE_IMG_URL+person.profile_path:'https://via.placeholder.com/32x44/1e1e21/666?text=?'}" class="autocomplete-img"><span>${person.name}</span>`;
                    item.addEventListener('click', async()=>{ this.value=""; document.getElementById('autocomplete-list').innerHTML=''; await makeGuess(person.id); });
                    document.getElementById('autocomplete-list').appendChild(item);
                });
            }, 300);
        });

        async function makeGuess(id) {
            if (gameState.status !== "playing") return;
            const g = await fetchCleanActorData(id);
            gameState.guesses.unshift(g);
            document.getElementById('headerRow').style.display='grid';
            displayGuess(g, false);
            if (g.id===targetActor.id) { gameState.status="won"; endGame(true); } 
            else { gameState.wrongCount++; if(gameState.wrongCount>=15) document.getElementById('giveUpBtn').style.display='block'; checkHints(); }
            localStorage.setItem(`actordle_v3_day_${currentDayIdx}`, JSON.stringify(gameState));
        }

        function giveUp() { gameState.status="failed"; localStorage.setItem(`actordle_v3_day_${currentDayIdx}`, JSON.stringify(gameState)); endGame(true); }
        function endGame(show) {
            document.getElementById('searchArea').style.display='none'; document.getElementById('giveUpBtn').style.display='none'; document.getElementById('message').style.display='none'; document.getElementById('showStatsBtn').style.display='block';
            document.getElementById('endActorImg').src=targetActor.image; document.getElementById('endActorName').innerText=targetActor.name;
            const t=document.getElementById('endTitle'); if(gameState.status==="won"){ t.innerText="BRAWO!"; t.style.color="var(--green)"; } else { t.innerText="PORAŻKA!"; t.style.color="var(--red)"; }
            document.getElementById('endActorStats').innerText = gameState.status==="won" ? `Zgadłeś w ${gameState.guesses.length} próbach.` : "To nie był Twój dzień.";
            if(show) openEndModal(); startCountdown();
        }

        function openEndModal() { document.getElementById('endModal').style.display='flex'; }
        function closeEndModal() { document.getElementById('endModal').style.display='none'; }
        function openModal(src, isB) { const img=document.getElementById('modalImg'); img.src=src; img.className = isB ? 'modal-content blurred' : 'modal-content'; document.getElementById('imageModal').style.display='flex'; }
        function closeModal() { document.getElementById('imageModal').style.display='none'; }

        function copyShareResult() {
            let grid = ""; [...gameState.guesses].reverse().forEach(g => {
                grid += (g.id===targetActor.id?"🟩":"🟥") + (g.gender===targetActor.gender?"🟩":"🟥") + (g.genre===targetActor.genre?"🟩":"🟥") + (g.projects.some(p=>targetActor.projects.some(tp=>tp.id===p.id))||g.id===targetActor.id?"🟩":"🟥") + (g.year===targetActor.year?"🟩":(Math.abs(g.year-targetActor.year)<=5?"🟨":"🟥")) + (g.debut===targetActor.debut?"🟩":(Math.abs(g.debut-targetActor.debut)<=3?"🟨":"🟥")) + (g.moviesPlayed===targetActor.moviesPlayed?"🟩":(Math.abs(g.moviesPlayed-targetActor.moviesPlayed)<=15?"🟨":"🟥")) + (g.nat===targetActor.nat?"🟩":"🟥") + "\n";
            });
            navigator.clipboard.writeText(`Actordle Dzień #${currentDayIdx}\nWynik: ${gameState.status==="won"?gameState.guesses.length:"X"}/15\n\n${grid}`).then(()=>alert("📋 Skopiowano do schowka!"));
        }

        function startCountdown() {
            setInterval(()=>{
                const now=new Date(), tom=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1), d=tom-now;
                document.getElementById('countdownTimer').innerText=String(Math.floor(d/3600000)).padStart(2,'0')+":"+String(Math.floor((d%3600000)/60000)).padStart(2,'0')+":"+String(Math.floor((d%60000)/1000)).padStart(2,'0');
            },1000);
        }

        function checkHints() {
            const c=document.getElementById('hintsContainer'); if(!targetActor.projects||targetActor.projects.length<3) return;
            c.innerHTML=''; c.style.display='flex';
            const count=gameState.wrongCount;
            if(count>=2) addHintDOM(1, targetActor.projects[2]?.poster, "Zagrał w:", targetActor.projects[2]?.title, count<3);
            if(count>=5) addHintDOM(2, targetActor.projects[1]?.poster, "Wielki hit:", targetActor.projects[1]?.title, count<6);
            if(count>=7) addHintDOM(3, null, "Postać:", targetActor.iconicCharacter, false);
            if(count>=9 && targetActor.topMovie) addHintDOM(4, targetActor.topMovie.poster, `Top Rated (⭐ ${targetActor.topMovie.rating}):`, targetActor.topMovie.title, count<10);
        }

        function addHintDOM(num, img, desc, txt, isB) {
            const h=document.createElement('div'); h.className='hint-box';
            let imgT = img ? `<img src="${img}" class="hint-poster ${isB?'blurred':''}" onclick="openModal('${img.replace('/w200/','/w500/')}', ${isB})">` : `<div class="hint-poster" style="display:flex;align-items:center;justify-content:center;background:var(--surface2);font-size:20px;">🎭</div>`;
            h.innerHTML=`${imgT}<div class="hint-text"><span class="hint-label">Podpowiedź ${num}</span><div style="font-size:11px;color:var(--text-dim);">${desc}</div><div class="hint-title">${isB?'???':txt}</div></div>`;
            document.getElementById('hintsContainer').appendChild(h);
        }

        function displayGuess(g, isR) {
            const row=document.createElement('div'); row.className='guess-row grid-cols';
            row.innerHTML = `<div class="box photo-box ${g.id===targetActor.id?'green':'red'}"><img src="${g.image}" class="actor-img"><span style="font-size:9px;">${g.name}</span></div>`;
            row.appendChild(createBox(g.gender, g.gender===targetActor.gender?'green':'red', isR));
            row.appendChild(createBox(g.genre, g.genre===targetActor.genre?'green':'red', isR));
            let sC=(g.projects.some(p=>targetActor.projects.some(tp=>tp.id===p.id))||g.id===targetActor.id)?'green':'red';
            row.appendChild(createBoxHTML(sC==='green'?`Tak<br><span style="font-size:9px;opacity:0.8;">🎬 ${g.projects.find(p=>targetActor.projects.some(tp=>tp.id===p.id))?.title || 'To ten!'}</span>`:"Nie", sC, isR));
            row.appendChild(createBox(g.year===0?"?":g.year+(g.year===targetActor.year?'':(g.year>targetActor.year?' ↓':' ↑')), g.year===targetActor.year?'green':(Math.abs(g.year-targetActor.year)<=5?'yellow':'red'), isR));
            row.appendChild(createBox(g.debut===0?"?":g.debut+(g.debut===targetActor.debut?'':(g.debut>targetActor.debut?' ↓':' ↑')), g.debut===targetActor.debut?'green':(Math.abs(g.debut-targetActor.debut)<=3?'yellow':'red'), isR));
            row.appendChild(createBox(g.moviesPlayed+(g.moviesPlayed===targetActor.moviesPlayed?'':(g.moviesPlayed>targetActor.moviesPlayed?' ↓':' ↑')), g.moviesPlayed===targetActor.moviesPlayed?'green':(Math.abs(g.moviesPlayed-targetActor.moviesPlayed)<=15?'yellow':'red'), isR));
            row.appendChild(createBox(g.nat, g.nat===targetActor.nat?'green':'red', isR));
            if(!isR) document.getElementById('guessesContainer').insertBefore(row, document.getElementById('guessesContainer').firstChild); else document.getElementById('guessesContainer').appendChild(row);
        }
        function createBox(t, c, n) { const b=document.createElement('div'); b.className=`box ${c}`; if(n) b.style.animation='none'; b.innerText=t; return b; }
        function createBoxHTML(h, c, n) { const b=document.createElement('div'); b.className=`box ${c}`; if(n) b.style.animation='none'; b.innerHTML=h; return b; }
        
        document.getElementById('prevDay').onclick = () => { location.search = `day=${currentDayIdx-1}`; };
        document.getElementById('nextDay').onclick = () => { location.search = `day=${currentDayIdx+1}`; };
        function closeEndModal() { document.getElementById('endModal').style.display='none'; }
        window.onload=initGame;
    </script>
</body>
</html>
