<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actordle</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --surface: #161618;
            --surface2: #1e1e21;
            --border: rgba(255,255,255,0.07);
            --border-bright: rgba(255,255,255,0.14);
            --gold: #e8c84a;
            --gold-dim: rgba(232,200,74,0.15);
            --green: #22c55e;
            --green-bg: rgba(34,197,94,0.12);
            --green-border: rgba(34,197,94,0.4);
            --red: #ef4444;
            --red-bg: rgba(239,68,68,0.12);
            --red-border: rgba(239,68,68,0.4);
            --yellow: #f59e0b;
            --yellow-bg: rgba(245,158,11,0.15);
            --yellow-border: rgba(245,158,11,0.4);
            --text: #f0eee8;
            --text-muted: #6b6966;
            --text-dim: #9c9893;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(232,200,74,0.06), transparent),
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.012) 40px, rgba(255,255,255,0.012) 41px),
                repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.012) 40px, rgba(255,255,255,0.012) 41px);
            color: var(--text);
            min-height: 100vh;
            padding: 0 0 60px;
        }

        /* ── HEADER & NAV ── */
        .site-header {
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 64px;
            background: rgba(13,13,15,0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { display: flex; align-items: baseline; gap: 6px; }
        .logo-icon { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.06em; color: var(--text); }
        .logo-badge { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); background: var(--gold-dim); border: 1px solid rgba(232,200,74,0.25); padding: 2px 8px; border-radius: 20px; }
        
        .archive-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0 10px;
        }
        .nav-btn {
            background: var(--surface);
            border: 1px solid var(--border-bright);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }
        .nav-btn:hover:not(:disabled) { background: var(--surface2); border-color: var(--gold); }
        .nav-btn:disabled { opacity: 0.2; cursor: not-allowed; }
        .day-label { font-family: 'Bebas Neue'; font-size: 24px; color: var(--gold); letter-spacing: 1px; }

        .page-center { max-width: 950px; margin: 0 auto; padding: 10px 20px 0; }
        .tagline { text-align: center; font-size: 13px; font-weight: 300; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 20px; }

        #message { text-align: center; font-size: 15px; font-weight: 500; color: var(--gold); margin-bottom: 20px; min-height: 24px; }

        .search-container { position: relative; margin-bottom: 15px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .search-container input { width: 100%; padding: 14px 18px 14px 46px; font-size: 15px; font-family: 'DM Sans', sans-serif; background: var(--surface); border: 1px solid var(--border-bright); border-radius: 12px; color: var(--text); outline: none; }
        .search-container input:focus { border-color: rgba(232,200,74,0.5); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

        /* Przycisk Give Up */
        #giveUpBtn { display: none; background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid var(--red-border); padding: 10px 20px; border-radius: 10px; cursor: pointer; margin: 0 auto 20px; font-family: 'DM Sans'; font-weight: 600; font-size: 13px; transition: 0.2s; }
        #giveUpBtn:hover { background: var(--red); color: white; }

        .results-btn { display: none; background: var(--surface2); color: var(--gold); border: 1px solid var(--gold); padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; margin: 0 auto 24px; font-family: 'DM Sans'; }

        /* Reszta styli (Tabele, Podpowiedzi, Modale) identyczna jak wcześniej */
        .autocomplete-items { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface2); border: 1px solid var(--border-bright); border-radius: 12px; z-index: 200; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
        .autocomplete-item { padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
        .autocomplete-item:hover { background: rgba(255,255,255,0.04); }
        .autocomplete-img { width: 32px; height: 44px; object-fit: cover; border-radius: 6px; }

        .hints-container { display: none; flex-direction: column; gap: 10px; margin-bottom: 24px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .hint-box { background: var(--surface); border: 1px solid var(--border-bright); border-left: 3px solid var(--gold); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 14px; animation: slideDown 0.3s ease; }
        .hint-poster { width: 44px; height: 64px; object-fit: cover; border-radius: 5px; flex-shrink: 0; transition: transform 0.2s; cursor: pointer; }
        .hint-poster.blurred { filter: blur(10px) grayscale(0.3); }
        .hint-label { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }
        .hint-title { font-size: 14px; font-weight: 600; color: var(--text); }

        .board { margin-top: 4px; overflow-x: auto; padding-bottom: 10px; }
        .grid-cols { grid-template-columns: 100px 48px 80px 1fr 60px 60px 80px 85px; width: 100%; min-width: 680px; }
        .header-row { display: none; gap: 6px; margin-bottom: 8px; }
        .header-row.grid-cols { display: grid; }
        .header-box { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; }

        .guess-row { display: grid; gap: 6px; margin-bottom: 6px; }
        .box { border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; text-align: center; min-height: 76px; border: 1px solid transparent; animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .box.green  { background: var(--green-bg); border-color: var(--green-border); color: #86efac; }
        .box.red    { background: var(--red-bg); border-color: var(--red-border); color: #fca5a5; }
        .box.yellow { background: var(--yellow-bg); border-color: var(--yellow-border); color: #fcd34d; }
        .photo-box { background: var(--surface); border-color: var(--border-bright) !important; }
        .actor-img { width: 48px; height: 64px; object-fit: cover; border-radius: 6px; margin-bottom: 5px; }
        .actor-name { font-size: 10px; color: var(--text-dim); }

        .modal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); justify-content: center; align-items: center; }
        .modal-card { background: var(--surface); border: 1px solid var(--border-bright); padding: 30px; border-radius: 20px; text-align: center; width: min(90vw, 400px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .end-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; margin-bottom: 20px; }
        .end-actor-card { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px; }
        .end-actor-img { width: 90px; height: 130px; object-fit: cover; border-radius: 12px; border: 2px solid var(--green); }
        .end-actor-info { text-align: left; }
        .end-actor-name { font-size: 22px; font-weight: 600; color: white; margin-bottom: 4px; }
        .share-btn { background: var(--green); color: black; border: none; padding: 12px 24px; font-family: 'DM Sans'; font-weight: 600; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin: 0 auto 20px; }
        .close-modal { position: absolute; top: 18px; right: 22px; color: white; font-size: 32px; cursor: pointer; }
        .modal-content { max-width: min(90vw, 360px); border-radius: 12px; transition: filter 0.3s; }
        .modal-content.blurred { filter: blur(30px); }

        /* Panel Admin */
        #adminPanel { display: none; background: var(--surface); border: 1px solid var(--red-border); border-radius: 12px; padding: 20px; margin-bottom: 20px; max-width: 400px; margin-left: auto; margin-right: auto; }
        #adminPanel textarea { width: 100%; height: 56px; background: var(--bg); border: 1px solid var(--border-bright); border-radius: 8px; color: var(--text); font-family: monospace; font-size: 12px; padding: 8px; margin-bottom: 8px; }
        .admin-btn { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; }

        @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideDown { 0% { transform: translateY(-20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="logo"><span class="logo-icon">🎬 Actordle</span><span class="logo-badge">Dzienny</span></div>
    </header>

    <div class="archive-nav">
        <button id="prevDay" class="nav-btn" title="Poprzedni dzień">◀</button>
        <div id="dayLabel" class="day-label">Dzień #...</div>
        <button id="nextDay" class="nav-btn" title="Następny dzień">▶</button>
    </div>

    <div class="page-center">
        <p class="tagline">Odgadnij dzisiejszą gwiazdę!</p>

        <div id="adminPanel">
            <h3>⚠ Panel Twórcy</h3>
            <textarea id="adminInput" placeholder="ID aktorów lub Szyfr..."></textarea>
            <button class="admin-btn" onclick="generateSecret()">Szyfruj</button>
            <button class="admin-btn" onclick="decryptSecret()">Deszyfruj</button>
            <textarea id="adminOutput" readonly style="margin-top:10px;"></textarea>
        </div>

        <div id="message">Ładowanie… ⏳</div>
        <div id="hintsContainer" class="hints-container"></div>

        <div class="search-container" id="searchArea">
            <span class="search-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </span>
            <input type="text" id="actorInput" placeholder="Wyszukaj aktora…" autocomplete="off" disabled>
            <div id="autocomplete-list" class="autocomplete-items"></div>
        </div>

        <button id="giveUpBtn" onclick="giveUp()">🏳 PODDAJ SIĘ (POKAŻ ROZWIĄZANIE)</button>
        <button id="showStatsBtn" class="results-btn" onclick="openEndModal()">📊 POKAŻ MOJE STATYSTYKI</button>

        <div class="board" id="board">
            <div class="header-row grid-cols" id="headerRow" style="display:none;">
                <div class="header-box">Aktor</div><div class="header-box">Płeć</div><div class="header-box">Gatunek</div><div class="header-box">Wspólny Film</div><div class="header-box">Rok ur.</div><div class="header-box">Debiut</div><div class="header-box">L. filmów</div><div class="header-box">Kraj ur.</div>
            </div>
            <div id="guessesContainer"></div>
        </div>
    </div>

    <!-- MODALE -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <div id="endModal" class="modal">
        <div class="modal-card">
            <span class="close-modal" onclick="closeEndModal()">&times;</span>
            <div id="endTitle" class="end-title">...</div>
            <div class="end-actor-card">
                <img id="endActorImg" class="end-actor-img" src="" alt="">
                <div class="end-actor-info">
                    <div id="endActorName" class="end-actor-name"></div>
                    <div id="endActorStats" style="font-size:14px; color:var(--text-dim);"></div>
                </div>
            </div>
            <button id="shareBtn" class="share-btn" onclick="copyShareResult()">UDOSTĘPNIJ WYNIK</button>
            <div style="border-top:1px solid var(--border); padding-top:20px; color:var(--text-muted); font-size:12px;">
                NASTĘPNY AKTOR ZA:
                <div id="countdownTimer" style="font-family:'Bebas Neue'; font-size:28px; color:var(--gold);">00:00:00</div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "c0970fd5760199b84883ecdc8d3aaec0";
        const BASE_IMG_URL = "https://image.tmdb.org/t/p/w200";
        const secretList = "MTE2LDI4NywzMjkyLDEyNDUsNTAwLDUwNjQsNjM4NCwyMzQzNTI=";
        const GAME_START_DATE = new Date("2024-01-01T00:00:00");
        const genreMap = { 28:"Akcja",12:"Przygoda",16:"Animacja",35:"Komedia",80:"Kryminał",99:"Dokument",18:"Dramat",10751:"Familijny",14:"Fantasy",36:"Historia",27:"Horror",10402:"Muzyczny",9648:"Tajemnica",10749:"Romans",878:"Sci-Fi",10770:"Film TV",53:"Thriller",10752:"Wojenny",37:"Western" };

        let targetActor = null;
        let gameState = { guesses:[], wrongCount:0, status: "playing" }; // status: "playing", "won", "failed"
        let currentDayIdx = 0;

        function getDecodedList() { try { return atob(secretList).split(',').map(id => parseInt(id.trim())); } catch(e) { return [116]; } }
        function generateSecret() { document.getElementById('adminOutput').value = btoa(document.getElementById('adminInput').value); }
        function decryptSecret() { document.getElementById('adminOutput').value = atob(document.getElementById('adminInput').value); }

        async function initGame() {
            const answerList = getDecodedList();
            const today = new Date(); today.setHours(0,0,0,0);
            const realDiff = Math.floor(Math.abs(today - GAME_START_DATE) / 86400000);

            // Sprawdzanie wybranego dnia z URL
            const urlParams = new URLSearchParams(window.location.search);
            let dayParam = urlParams.get('day');
            currentDayIdx = dayParam !== null ? parseInt(dayParam) : realDiff;

            document.getElementById('dayLabel').innerText = `Dzień #${currentDayIdx}`;
            document.getElementById('prevDay').disabled = currentDayIdx <= 0;
            document.getElementById('nextDay').disabled = currentDayIdx >= realDiff;

            targetActor = await fetchFullActorData(answerList[currentDayIdx % answerList.length]);
            loadGameState();
            
            document.getElementById('actorInput').disabled = gameState.status !== "playing";
            document.getElementById('message').innerText = gameState.status === "playing" ? "Wpisz nazwisko gwiazdy!" : "";

            if (gameState.guesses.length > 0) {
                document.getElementById('headerRow').style.display = 'grid';
                for (let i = gameState.guesses.length-1; i >= 0; i--) displayGuess(gameState.guesses[i], true);
                checkHints();
            }
            if (gameState.status !== "playing") endGame(false);
        }

        function loadGameState() {
            const saved = localStorage.getItem(`actordle_save_${currentDayIdx}`);
            if (saved) { gameState = JSON.parse(saved); return; }
            gameState = { guesses:[], wrongCount:0, status: "playing" };
        }
        function saveGameState() { localStorage.setItem(`actordle_save_${currentDayIdx}`, JSON.stringify(gameState)); }

        async function fetchFullActorData(personId) {
            const res = await fetch(`https://api.themoviedb.org/3/person/${personId}?api_key=${API_KEY}&append_to_response=movie_credits&language=pl-PL`);
            const data = await res.json();
            let country = data.place_of_birth ? data.place_of_birth.split(',').pop().trim() : "Nieznany";
            if (country==="UK"||country==="England") country="Wlk. Brytania";
            let projects=[]; let mainG="Nieznany"; let debut=0; let charN="?"; let topM=null;
            if (data.movie_credits?.cast) {
                const sorted = [...data.movie_credits.cast].sort((a,b)=>b.popularity-a.popularity);
                for (let m of sorted) { if (m.character && m.character.length>2 && !m.character.toLowerCase().includes("self")) { charN=m.character; break; } }
                const dated = data.movie_credits.cast.filter(m=>m.release_date?.length>3).sort((a,b)=>new Date(a.release_date)-new Date(b.release_date));
                if (dated.length>0) debut = parseInt(dated[0].release_date.substring(0,4));
                projects = sorted.slice(0,30).map(m=>({id:m.id,title:m.title,poster:m.poster_path?BASE_IMG_URL+m.poster_path:'https://via.placeholder.com/40x60/1e1e21/666?text=?'}));
                let gCounts={}; data.movie_credits.cast.forEach(m=>{ m.genre_ids?.forEach(id=>{ gCounts[id]=(gCounts[id]||0)+1; }); });
                let topG = Object.keys(gCounts).sort((a,b)=>gCounts[b]-gCounts[a])[0]; if (topG && genreMap[topG]) mainG = genreMap[topG];
                const hiRated = data.movie_credits.cast.filter(m=>m.vote_count>=300).sort((a,b)=>b.vote_average-a.vote_average);
                for(let m of hiRated) { if (projects[2]?.id!==m.id && projects[1]?.id!==m.id) { topM={title:m.title, poster:m.poster_path?BASE_IMG_URL+m.poster_path:'https://via.placeholder.com/40x60/1e1e21/666?text=?', rating:m.vote_average.toFixed(1)}; break; } }
            }
            return { id:data.id, name:data.name, gender:data.gender===1?'K':'M', year:data.birthday?parseInt(data.birthday.substring(0,4)):0, debut, moviesPlayed:data.movie_credits?.cast.length||0, topMovie:topM, iconicCharacter:charN, nat:country, projects, genre:mainG, image:data.profile_path?BASE_IMG_URL+data.profile_path:'https://via.placeholder.com/200x300/1e1e21/666?text=?' };
        }

        const inputField = document.getElementById('actorInput');
        inputField.addEventListener('input', function() {
            let val = this.value; document.getElementById('autocomplete-list').innerHTML='';
            if (val.toUpperCase()==="ADMIN") { document.getElementById('adminPanel').style.display='block'; return; }
            if (!val) return;
            clearTimeout(this.timeout);
            this.timeout = setTimeout(async()=>{
                const res = await fetch(`https://api.themoviedb.org/3/search/person?api_key=${API_KEY}&query=${val}&language=pl-PL`);
                const data = await res.json();
                data.results.filter(p=>p.known_for_department==="Acting").slice(0,5).forEach(person=>{
                    const item = document.createElement('div'); item.className='autocomplete-item';
                    item.innerHTML=`<img src="${person.profile_path?BASE_IMG_URL+person.profile_path:'https://via.placeholder.com/32x44/1e1e21/666?text=?'}" class="autocomplete-img"><span>${person.name}</span>`;
                    item.addEventListener('click', async()=>{ inputField.value=""; document.getElementById('autocomplete-list').innerHTML=''; await makeGuess(person.id); });
                    document.getElementById('autocomplete-list').appendChild(item);
                });
            }, 300);
        });

        async function makeGuess(personId) {
            if (gameState.status !== "playing") return;
            inputField.disabled=true; document.getElementById('message').innerText="Analiza… ⏳";
            const guessed = await fetchFullActorData(personId);
            gameState.guesses.unshift(guessed);
            document.getElementById('headerRow').style.display='grid';
            displayGuess(guessed, false);
            if (guessed.id===targetActor.id) { gameState.status = "won"; saveGameState(); endGame(true); } 
            else { 
                gameState.wrongCount++; 
                if(gameState.wrongCount >= 15) document.getElementById('giveUpBtn').style.display = 'block';
                saveGameState(); checkHints(); document.getElementById('message').innerText="Szukaj dalej!"; inputField.disabled=false; inputField.focus(); 
            }
        }

        function giveUp() {
            if (gameState.status !== "playing") return;
            gameState.status = "failed";
            saveGameState();
            endGame(true);
        }

        function endGame(showModal) {
            document.getElementById('searchArea').style.display = 'none';
            document.getElementById('giveUpBtn').style.display = 'none';
            document.getElementById('message').style.display = 'none';
            document.getElementById('showStatsBtn').style.display = 'block';
            document.getElementById('endActorImg').src = targetActor.image;
            document.getElementById('endActorName').innerText = targetActor.name;
            const title = document.getElementById('endTitle');
            if (gameState.status === "won") { title.innerText = "BRAWO!"; title.style.color = "var(--green)"; }
            else { title.innerText = "PORAŻKA!"; title.style.color = "var(--red)"; }
            document.getElementById('endActorStats').innerText = gameState.status === "won" ? `Odgadnięto w ${gameState.guesses.length} próbach` : "Nie udało się odgadnąć.";
            if (showModal) openEndModal();
            startCountdown();
        }

        function openEndModal() { document.getElementById('endModal').style.display = 'flex'; }
        function closeEndModal() { document.getElementById('endModal').style.display = 'none'; }

        function copyShareResult() {
            let grid = "";
            [...gameState.guesses].reverse().forEach(g => {
                grid += g.id === targetActor.id ? "🟩" : "🟥";
                grid += g.gender === targetActor.gender ? "🟩" : "🟥";
                grid += g.genre === targetActor.genre ? "🟩" : "🟥";
                grid += (g.projects.some(p => targetActor.projects.some(tp => tp.id === p.id)) || g.id === targetActor.id) ? "🟩" : "🟥";
                grid += g.year === targetActor.year ? "🟩" : (Math.abs(g.year - targetActor.year) <= 5 ? "🟨" : "🟥");
                grid += g.debut === targetActor.debut ? "🟩" : (Math.abs(g.debut - targetActor.debut) <= 3 ? "🟨" : "🟥");
                grid += g.moviesPlayed === targetActor.moviesPlayed ? "🟩" : (Math.abs(g.moviesPlayed - targetActor.moviesPlayed) <= 15 ? "🟨" : "🟥");
                grid += g.nat === targetActor.nat ? "🟩" : "🟥";
                grid += "\n";
            });
            const text = `Actordle Dzień #${currentDayIdx}\nWynik: ${gameState.status === "won" ? gameState.guesses.length : "X"}/15\n\n${grid}`;
            navigator.clipboard.writeText(text).then(() => alert("Kopiowano do schowka! 📋"));
        }

        function startCountdown() {
            setInterval(()=>{
                const now=new Date(), tom=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1), d=tom-now;
                const h=Math.floor(d/3600000), m=Math.floor((d%3600000)/60000), s=Math.floor((d%60000)/1000);
                document.getElementById('countdownTimer').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        }

        function openModal(src, isBlurred) { const img = document.getElementById('modalImg'); img.src = src; if (isBlurred) img.classList.add('blurred'); else img.classList.remove('blurred'); document.getElementById('imageModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('imageModal').style.display = 'none'; }
        function closeEndModal() { document.getElementById('endModal').style.display = 'none'; }

        function checkHints() {
            const c = document.getElementById('hintsContainer'); if (!targetActor.projects || targetActor.projects.length < 3) return;
            c.innerHTML=''; c.style.display='flex';
            const count = gameState.wrongCount;
            if (count >= 2) addHintDOM(1, targetActor.projects[2]?.poster, "Zagrał(a) w:", targetActor.projects[2]?.title, count < 3);
            if (count >= 5) addHintDOM(2, targetActor.projects[1]?.poster, "Wielki hit:", targetActor.projects[1]?.title, count < 6);
            if (count >= 7) addHintDOM(3, null, "Postać:", targetActor.iconicCharacter, false);
            if (count >= 9 && targetActor.topMovie) addHintDOM(4, targetActor.topMovie.poster, `Top Rated (⭐ ${targetActor.topMovie.rating}):`, targetActor.topMovie.title, count < 10);
            if (count < 2) c.style.display='none';
        }

        function addHintDOM(num, img, desc, txt, isB) {
            const hint=document.createElement('div'); hint.className='hint-box';
            let imgT = img ? `<img src="${img}" class="hint-poster ${isB?'blurred':''}" onclick="openModal('${img.replace('/w200/','/w500/')}', ${isB})">` : `<div class="hint-poster" style="display:flex;align-items:center;justify-content:center;background:var(--surface2);font-size:20px;">🎭</div>`;
            hint.innerHTML = `${imgT} <div class="hint-text"><span class="hint-label">Podpowiedź ${num}</span><div style="font-size:11px;color:var(--text-dim);">${desc}</div><div class="hint-title">${isB ? '???' : txt}</div></div>`;
            document.getElementById('hintsContainer').appendChild(hint);
        }

        function displayGuess(g, isR) {
            const row = document.createElement('div'); row.className = 'guess-row grid-cols';
            row.appendChild(createPhotoBox(g, g.id===targetActor.id?'green':'red', isR));
            row.appendChild(createBox(g.gender, g.gender===targetActor.gender?'green':'red', isR));
            row.appendChild(createBox(g.genre, g.genre===targetActor.genre?'green':'red', isR));
            let sC = (g.projects.some(p => targetActor.projects.some(tp => tp.id === p.id)) || g.id === targetActor.id) ? 'green' : 'red';
            let sT = sC === 'green' ? `Tak<br><span style="font-size:9px;opacity:0.8;">🎬 ${g.projects.find(p=>targetActor.projects.some(tp=>tp.id===p.id))?.title || 'Ten aktor!'}</span>` : "Nie";
            row.appendChild(createBoxHTML(sT, sC, isR));
            row.appendChild(createBox(g.year===0?"?":g.year+(g.year===targetActor.year?'':(g.year>targetActor.year?' ↓':' ↑')), g.year===targetActor.year?'green':(Math.abs(g.year-targetActor.year)<=5?'yellow':'red'), isR));
            row.appendChild(createBox(g.debut===0?"?":g.debut+(g.debut===targetActor.debut?'':(g.debut>targetActor.debut?' ↓':' ↑')), g.debut===targetActor.debut?'green':(Math.abs(g.debut-targetActor.debut)<=3?'yellow':'red'), isR));
            row.appendChild(createBox(g.moviesPlayed+(g.moviesPlayed===targetActor.moviesPlayed?'':(g.moviesPlayed>targetActor.moviesPlayed?' ↓':' ↑')), g.moviesPlayed===targetActor.moviesPlayed?'green':(Math.abs(g.moviesPlayed-targetActor.moviesPlayed)<=15?'yellow':'red'), isR));
            row.appendChild(createBox(g.nat, g.nat===targetActor.nat?'green':'red', isR));
            if (!isR) document.getElementById('guessesContainer').insertBefore(row, document.getElementById('guessesContainer').firstChild); else document.getElementById('guessesContainer').appendChild(row);
        }

        function createBox(t, c, n) { const b=document.createElement('div'); b.className=`box ${c}`; if(n) b.style.animation='none'; b.innerText=t; return b; }
        function createBoxHTML(h, c, n) { const b=document.createElement('div'); b.className=`box ${c}`; if(n) b.style.animation='none'; b.innerHTML=h; return b; }
        function createPhotoBox(a, c, n) {
            const b=document.createElement('div'); b.className=`box photo-box ${c}`; if(n) b.style.animation='none';
            b.innerHTML=`<img src="${a.image}" class="actor-img"><span class="actor-name" style="font-size:9px;">${a.name}</span>`;
            return b;
        }

        document.getElementById('prevDay').onclick = () => { window.location.search = `day=${currentDayIdx-1}`; };
        document.getElementById('nextDay').onclick = () => { window.location.search = `day=${currentDayIdx+1}`; };

        window.onload=initGame;
    </script>
</body>
</html>
